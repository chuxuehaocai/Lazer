name: Build nextgen

on:
  push:
    branches: [nextgen]
    tags: ['v*']
  pull_request:
    branches: [nextgen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  FLUTTER_REVISION: '4cf24164269a5ebf0c16a028a00727d0e77bbb05'
  # Tag builds stamp the release version the update checker compares against;
  # branch builds stamp the branch name, which BuildInfo rejects in favour of
  # its pubspec fallback.
  LAZER_VERSION: ${{ github.ref_name }}

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded

  windows:
    name: Windows EXE (x86_64)
    needs: check
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure FFmpeg install prefix
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "LAZER_FFMPEG_ROOT=$env:RUNNER_TEMP\lazer-ffmpeg"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: make nasm diffutils git perl
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Build DSD-capable LGPL FFmpeg with MSVC
        shell: msys2 {0}
        env:
          FFMPEG_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          command -v cl.exe
          prefix="$(cygpath -u "$LAZER_FFMPEG_ROOT")"
          bash ./native/lazer-audio/tools/build_dsd_ffmpeg.sh "$prefix"
      - run: flutter build windows --release --no-pub --dart-define=LAZER_COMMIT=${{ github.sha }} --dart-define=LAZER_VERSION=${{ env.LAZER_VERSION }}
      - name: Stage native audio and FFmpeg into the Windows bundle
        shell: pwsh
        run: |
          dart run tool/build_native_audio.dart --ffmpeg-root "$env:LAZER_FFMPEG_ROOT"
          $release = 'build/windows/x64/runner/Release'
          Get-ChildItem -LiteralPath 'build/native-audio' -Filter '*.dll' -File |
            Copy-Item -Destination $release -Force
          $license = Join-Path $release 'licenses/lazer-ffmpeg'
          New-Item -ItemType Directory -Path $license -Force | Out-Null
          Copy-Item -Path "$env:LAZER_FFMPEG_ROOT/share/lazer-ffmpeg/*" -Destination $license -Force
      - name: Package EXE, DLLs, resources and Visual C++ runtime
        shell: pwsh
        run: ./ci/package-windows.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Lazer-Windows-x86_64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos-native:
    name: macOS native audio (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            flutter_arch: arm64
          - arch: x86_64
            runner: macos-15-intel
            flutter_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: ${{ matrix.flutter_arch }}
      - name: Install native build tools
        run: brew install cmake ninja nasm pkgconf
      - run: flutter pub get --enforce-lockfile
      - name: Build DSD-capable LGPL FFmpeg and native audio
        env:
          FFMPEG_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          ffmpeg_root="$RUNNER_TEMP/lazer-ffmpeg"
          bash ./native/lazer-audio/tools/build_dsd_ffmpeg.sh "$ffmpeg_root"
          dart run tool/build_native_audio.dart --ffmpeg-root "$ffmpeg_root"
          mkdir -p dist/licenses/lazer-ffmpeg
          cp build/native-audio/*.dylib dist/
          cp "$ffmpeg_root/share/lazer-ffmpeg/"* dist/licenses/lazer-ffmpeg/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-deps-macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    name: macOS App (${{ matrix.arch }})
    needs: [check, macos-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            runner: macos-15
            flutter_arch: arm64
            xcode_archs: 'arm64 x86_64'
          - arch: x86_64
            runner: macos-15-intel
            flutter_arch: x64
            xcode_archs: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Ad-hoc signing needs no Apple account, certificate or provisioning profile.
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
      FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_archs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: ${{ matrix.flutter_arch }}
      - run: xcodebuild -version
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: native-deps-macos-*
          path: build/native-dependencies
          merge-multiple: false
      - name: Prepare architecture-matched native audio libraries
        shell: bash
        run: |
          set -euo pipefail
          stage=build/native-audio-package
          arm=build/native-dependencies/native-deps-macos-arm64
          x86=build/native-dependencies/native-deps-macos-x86_64
          mkdir -p "$stage/licenses/lazer-ffmpeg"
          if [[ "${{ matrix.arch }}" == universal ]]; then
            for arm_lib in "$arm"/*.dylib; do
              name="${arm_lib##*/}"
              test -f "$x86/$name"
              lipo -create "$arm_lib" "$x86/$name" -output "$stage/$name"
            done
            cp "$arm/licenses/lazer-ffmpeg/"* "$stage/licenses/lazer-ffmpeg/"
          else
            cp "$x86/"*.dylib "$stage/"
            cp "$x86/licenses/lazer-ffmpeg/"* "$stage/licenses/lazer-ffmpeg/"
          fi
          test -f "$stage/liblazer-audio.dylib"
          test -f "$stage/liblazer-audio-bridge.dylib"
      - run: flutter build macos --release --no-pub --dart-define=LAZER_COMMIT=${{ github.sha }} --dart-define=LAZER_VERSION=${{ env.LAZER_VERSION }}
      - name: Package App with executable permissions and framework symlinks
        shell: bash
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/lazer_nextgen.app
          test -d "$app"
          runtime="$app/Contents/MacOS"
          cp build/native-audio-package/*.dylib "$runtime/"
          mkdir -p "$app/Contents/Resources/licenses/lazer-ffmpeg"
          cp build/native-audio-package/licenses/lazer-ffmpeg/* \
            "$app/Contents/Resources/licenses/lazer-ffmpeg/"
          read -r -a required_archs <<< "$FLUTTER_XCODE_ARCHS"
          lipo "$app/Contents/MacOS/lazer_nextgen" -verify_arch "${required_archs[@]}"
          for library in "$runtime"/*.dylib; do
            lipo "$library" -verify_arch "${required_archs[@]}"
          done
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          test -f "$runtime/liblazer-audio.dylib"
          test -f "$runtime/liblazer-audio-bridge.dylib"
          for component in avcodec avformat avutil swresample; do
            compgen -G "$runtime/lib${component}*.dylib" > /dev/null
          done
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/Lazer-macOS-${{ matrix.arch }}.zip
          (cd dist && shasum -a 256 Lazer-macOS-${{ matrix.arch }}.zip > Lazer-macOS-${{ matrix.arch }}.zip.sha256)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Lazer-macOS-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            flutter_target: linux-x64
            bundle_arch: x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            flutter_target: linux-arm64
            bundle_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build, GTK, audio and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev libayatana-appindicator3-dev libgdk-pixbuf2.0-dev \
            librsvg2-dev patchelf file desktop-file-utils fuse libfuse2 nasm \
            libasound2-dev \
            xvfb dbus-x11
      - if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Bootstrap official Flutter SDK on native Linux ARM64
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/flutter-arm64"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" --version
          "$sdk/bin/flutter" precache --linux
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Build DSD-capable LGPL FFmpeg
        env:
          FFMPEG_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/lazer-ffmpeg"
          bash ./native/lazer-audio/tools/build_dsd_ffmpeg.sh "$prefix"
          echo "LAZER_FFMPEG_ROOT=$prefix" >> "$GITHUB_ENV"
      - run: flutter build linux --release --no-pub --target-platform ${{ matrix.flutter_target }} --dart-define=LAZER_COMMIT=${{ github.sha }} --dart-define=LAZER_VERSION=${{ env.LAZER_VERSION }}
      - name: Stage native audio and FFmpeg into the Linux bundle
        run: |
          set -euo pipefail
          dart run tool/build_native_audio.dart --ffmpeg-root "$LAZER_FFMPEG_ROOT"
          bundle="build/linux/${{ matrix.bundle_arch }}/release/bundle"
          cp build/native-audio/*.so* "$bundle/lib/"
          mkdir -p "$bundle/lib/licenses/lazer-ffmpeg"
          cp "$LAZER_FFMPEG_ROOT/share/lazer-ffmpeg/"* \
            "$bundle/lib/licenses/lazer-ffmpeg/"
      - name: Bundle GTK, libmpv and Flutter into AppImage
        run: bash ci/package-appimage.sh ${{ matrix.arch }}
      - name: Check AppImage starts with a display and session bus
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 15s dbus-run-session -- xvfb-run -a \
            dist/Lazer-Linux-${{ matrix.arch }}.AppImage --appimage-extract-and-run > build/appimage-smoke.log 2>&1
          result=$?
          set -e
          cat build/appimage-smoke.log
          test "$result" -eq 124
          if grep -Eq 'Unhandled exception|error while loading shared libraries|Cannot find libmpv' build/appimage-smoke.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Lazer-Linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Release signing material. See docs/builds.md; generate the values with
      # ci/generate-android-keystore.ps1. Pull requests from forks cannot read
      # secrets, so those builds fall back to the debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Materialise the release keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release signing secrets are missing; refusing to publish a debug-signed release."
              exit 1
            fi
            echo "::warning::Release signing secrets are not configured; building a debug-signed APK."
            exit 0
          fi
          install -d android/app
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          EOF
          printf 'SIGNED_RELEASE=true\n' >> "$GITHUB_ENV"
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          # A tag build must never fall back to the debug key if the keystore step
          # silently produced nothing.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ORG_GRADLE_PROJECT_lazerRequireReleaseSigning=true
          fi
          flutter build apk --release --no-pub \
            --dart-define=LAZER_COMMIT=${{ github.sha }} \
            --dart-define=LAZER_VERSION=${{ env.LAZER_VERSION }}
      - name: Verify the APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk" || { echo "::error::Missing $apk"; exit 1; }
          apksigner=$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          if [[ "${SIGNED_RELEASE:-false}" == true ]]; then
            keytool -exportcert -keystore android/app/upload-keystore.jks \
              -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -file "$RUNNER_TEMP/release.cer" >/dev/null
            apksig_jar="$(dirname "$apksigner")/lib/apksigner.jar"
            test -f "$apksig_jar" || { echo "::error::Missing $apksig_jar"; exit 1; }
            java -cp "$apksig_jar" ci/VerifyApkSigner.java "$apk" "$RUNNER_TEMP/release.cer"
          else
            echo "::warning::APK is debug-signed (no release keystore configured)."
          fi
      - name: Package universal APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Lazer-Android-universal.apk
          (cd dist && sha256sum Lazer-Android-universal.apk > Lazer-Android-universal.apk.sha256)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Lazer-Android-universal
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ios:
    name: iOS unsigned IPA (arm64)
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --no-pub --dart-define=LAZER_COMMIT=${{ github.sha }} --dart-define=LAZER_VERSION=${{ env.LAZER_VERSION }}
      - name: Create unsigned IPA with the required Payload directory
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p dist/ios/Payload
          ditto build/ios/iphoneos/Runner.app dist/ios/Payload/Runner.app
          (cd dist/ios && zip -qry ../Lazer-iOS-aarch64.ipa Payload)
          unzip -l dist/Lazer-iOS-aarch64.ipa | grep 'Payload/Runner.app/Info.plist'
          (cd dist && shasum -a 256 Lazer-iOS-aarch64.ipa > Lazer-iOS-aarch64.ipa.sha256)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Lazer-iOS-aarch64
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, windows, macos, linux, android, ios]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            --pattern 'Lazer-*' --dir release-assets
      - name: Publish tag as a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f -print | sort)
          test "${#assets[@]}" -gt 0
          release_args=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}" \
            -R "$GITHUB_REPOSITORY"
