name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Android APK, arm64-v8a only.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble arm64 debug APK
        run: ./gradlew :androidApp:assembleDebug -PlazerAbis=arm64-v8a --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lazer-apk-arm64
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Desktop MSI + runnable fat jar (x64 runner).
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage needs WiX to produce an .msi.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build MSI
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi --stacktrace
      - name: Build runnable jar
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageUberJarForCurrentOS --stacktrace
      # Separate artifacts so each downloads as its own zip (msi.zip, jar.zip).
      - uses: actions/upload-artifact@v4
        with:
          name: lazer-msi
          path: desktopApp/build/compose/binaries/**/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lazer-jar
          path: desktopApp/build/compose/jars/*.jar
          if-no-files-found: error

  # Version tags publish the three deliverables uncompressed as release assets. A build without a
  # tag only leaves the Actions artifacts (lazer-apk-arm64.zip, msi.zip, jar.zip).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the three deliverables
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.msi' -o -name '*.jar' \) -exec cp {} release/ \;
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.msi
            release/*.jar
